# PAW3395 trackball/mouse sensor (badjeff/zmk-paw3395-driver)
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PAW3395=y
# Lower to 8 for snappier response when the dongle is on USB (default 0 = no limit)
# CONFIG_PAW3395_REPORT_INTERVAL_MIN=8

# Fetch both halves' battery levels and expose them to the host
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Carried over from the windows branch (TBK-MINI-CLICKY)
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
