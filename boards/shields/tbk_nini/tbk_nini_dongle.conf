# Dongle (central) — sends HID to the host and drives the Prospector display.
#
# Split, BLE central role, pointing (trackball forwarding) and the color
# ST7789V display are all enabled automatically:
#   - split/central/pointing        -> boards/shields/tbk_nini/Kconfig.defconfig
#   - display + color LVGL stack     -> prospector_adapter shield (module)

# --- Prospector status screen ---
CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
