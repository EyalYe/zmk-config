# Corne split with a dongle as central.
# The dongle (nice!nano v2) is the BLE central and hosts a PAW3395 + 5 buttons;
# both Corne halves (nice!nano v2) are peripherals.
---
include:
  - board: nice_nano@2.0.0//zmk
    shield: corne_dongle
  - board: nice_nano@2.0.0//zmk
    shield: corne_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: nice_nano@2.0.0//zmk
    shield: corne_right
  - board: nice_nano@2.0.0//zmk
    shield: settings_reset
