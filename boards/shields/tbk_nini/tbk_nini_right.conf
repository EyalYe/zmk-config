# Right half — carries the PAW3395 trackball on SPI.
# SPI and pointing are enabled via Kconfig.defconfig; only the driver-
# specific options live here. Orientation (invert-x / invert-y / swap-xy)
# is set on the trackball node in tbk_nini_right.overlay, not here.

CONFIG_PAW3395=y
CONFIG_PAW3395_REPORT_INTERVAL_MIN=6
CONFIG_PAW3395_INIT_POWER_UP_EXTRA_DELAY_MS=3000
# CONFIG_PAW3395_LOG_LEVEL_DBG=y
